<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nik and Ash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first app (max 480px): header, rose hero with both siblings, pill filter chips,
   2-column card grid, card detail screen, floating pill nav. Inspired by the rose fragrance kit
   and the warm flat-illustration fashion kit. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#14213D; --muted:#5C6785; --line:#E1E5F0;
  --rose:#B56A82; --rose-deep:#7B1E3A; --blush:#F7E7EC; --peach:#EEF1F8; --sage:#E4E9F5;
  --sun:#14213D; --sun-ink:#FFFFFF; --olive:#3E5C9A; --terra:#7B1E3A; --on-rose:#FFFFFF;
  --shadow:0 10px 30px rgba(20,33,61,.12);
  --display:"Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1630; --surface:#18244A; --ink:#F4F6FB; --muted:#A9B3D0; --line:#2A3866;
  --blush:#3A1B2E; --peach:#1F2D57; --sage:#1E2C55; --rose:#C8708A; --rose-deep:#B04A6C; --sun:#F4F6FB; --sun-ink:#14213D; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1630; --surface:#18244A; --ink:#F4F6FB; --muted:#A9B3D0; --line:#2A3866;
  --blush:#3A1B2E; --peach:#1F2D57; --sage:#1E2C55; --rose:#C8708A; --rose-deep:#B04A6C; --sun:#F4F6FB; --sun-ink:#14213D; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--rose-deep);outline-offset:3px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0}
p{margin:0}
.muted{color:var(--muted)}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.duo{display:flex;align-items:center;gap:10px}
.faces{display:flex}
.face{width:42px;height:42px;border-radius:50%;overflow:hidden;border:3px solid var(--bg);background:var(--blush)}
.face+.face{margin-left:-12px;background:var(--sage)}
.face svg{width:100%;height:100%;display:block}
.hello{line-height:1.2}
.hello b{font-family:var(--display);font-weight:700;font-size:17px;display:block}
.hello span{font-size:13px;color:var(--muted)}
.starpill{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.starpill svg{width:16px;height:16px;fill:currentColor}

/* hero */
.hero{background:var(--rose-deep);color:var(--on-rose);border-radius:28px;padding:22px 20px 18px;position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px;min-height:200px}
.hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero h1{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;text-wrap:balance}
.hero p{font-size:14px;opacity:.95;margin-top:6px}
.hero .left{display:flex;flex-direction:column;gap:12px;z-index:1}
.hero .art{position:relative;z-index:1;align-self:end;height:190px}
.hero .art .nik{position:absolute;right:44px;bottom:-26px;width:86px}
.hero .art .ash{position:absolute;right:-4px;bottom:-26px;width:70px}
.cta{display:flex;align-items:center;gap:8px}
.pill{border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:14px;background:var(--surface);color:var(--rose-deep)}
.round{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;background:rgba(255,255,255,.22);color:var(--on-rose)}
.round svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rankrow{display:flex;flex-direction:column;gap:6px;font-size:13px}
.rankrow .lbl{display:flex;flex-direction:column;gap:0;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .5s ease}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1.5px solid var(--rose);background:transparent;color:var(--rose-deep);border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-rose)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-family:var(--display);font-weight:700;font-size:19px}
.sec span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* grid cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.wcard{border:0;text-align:left;background:var(--surface);border-radius:24px;padding:8px 8px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative}
.tilebg{border-radius:18px;aspect-ratio:1/1;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.tilebg.nik{background:var(--blush)}
.tilebg.ash{background:var(--sage)}

.tilebg .bubble{position:absolute;left:8px;top:8px;right:8px;background:var(--surface);color:var(--ink);border-radius:14px 14px 14px 4px;padding:6px 10px;font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.wmeta{padding:0 6px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.wmeta .who{font-size:12px;color:var(--muted)}
.rar{display:inline-flex;gap:1px}
.rar svg{width:12px;height:12px;fill:var(--sun)}
.badge{position:absolute;top:14px;right:14px;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.badge.miss{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.empty{grid-column:1/-1;text-align:center;padding:30px 10px;color:var(--muted)}

.duo-art{position:relative;display:block;width:100%;height:100%}
.duo-art svg{position:absolute;bottom:-4px;display:block}
.duo-art .main svg{width:68%;right:2%}
.duo-art .side svg{width:46%;left:2%;bottom:-8px;filter:saturate(.9)}
.stage .duo-art{height:240px;width:270px;max-width:100%;margin-left:auto}
.stage .duo-art .main svg{width:60%}
.stage .duo-art .side svg{width:40%}
.tilebg{align-items:stretch}
/* detail */
.dtop{display:flex;align-items:center;justify-content:space-between}
.dtop .round{background:var(--rose-deep);color:var(--on-rose)}
.dtop .round.save[aria-pressed="false"]{background:var(--surface);color:var(--rose-deep);box-shadow:var(--shadow)}
.dtop .round.save svg{fill:none}
.dtop .round.save[aria-pressed="true"] svg{fill:currentColor}
.dtop .title{font-weight:600}
.stage{border-radius:28px;position:relative;overflow:hidden;min-height:240px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px}
.stage.nik{background:var(--blush)}
.stage.ash{background:var(--sage)}

.stage .say{position:absolute;left:16px;top:18px;max-width:58%;background:var(--surface);border-radius:18px 18px 18px 4px;padding:12px 14px;font-weight:500;font-size:14px;box-shadow:var(--shadow)}
.stage .say b{display:block;font-size:12px;color:var(--rose-deep);font-weight:700}
.wordhead{display:flex;flex-direction:column;gap:6px}
.wordhead h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,8.5vw,40px);line-height:1.05;color:var(--rose-deep);overflow-wrap:anywhere}
.subrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
.tagp{border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px;background:var(--peach)}
.tagp.sun{background:var(--sun);color:var(--sun-ink)}
.listen{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-weight:600;font-size:13px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;font-size:15px;font-weight:500;display:flex;gap:12px;align-items:center}
.opt .dot{flex:0 0 26px;height:26px;border-radius:50%;border:1.5px solid var(--rose);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--rose-deep)}
.opt:hover:not([disabled]){border-color:var(--rose)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--rose-deep);border-color:var(--rose-deep);color:var(--on-rose)}
.opt.right .dot{border-color:var(--on-rose);color:var(--on-rose)}
.opt.wrong{text-decoration:line-through;color:var(--muted)}
.opt.dim{opacity:.5}
.reveal{background:var(--peach);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.reveal .ex{font-style:italic}
.reveal .orig{font-size:13px;color:var(--muted)}
.bigbtn{border:0;width:100%;border-radius:999px;padding:15px 20px;font-weight:700;font-size:16px;background:var(--rose-deep);color:var(--on-rose);display:flex;align-items:center;justify-content:center;gap:10px}
.bigbtn.soft{background:var(--surface);color:var(--rose-deep);border:1.5px solid var(--rose)}
.bigbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.earned{display:inline-flex;gap:2px;vertical-align:middle}
.earned svg{width:16px;height:16px;fill:var(--sun)}
@media (prefers-reduced-motion:no-preference){.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{0%{transform:scale(.85)}100%{transform:scale(1)}}
  .hop svg.host{animation:hop .5s ease}@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-12px)}}}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px 10px;text-align:center;box-shadow:var(--shadow)}
.tile b{display:block;font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.ranks{display:flex;flex-direction:column;gap:8px}
.rk{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:12px 14px}
.rk .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--peach);font-weight:700;font-size:13px;flex:0 0 auto}
.rk.got .ic{background:var(--sun);color:var(--sun-ink)}
.rk.now{outline:2px solid var(--rose-deep)}
.rk div{flex:1}
.rk small{display:block;color:var(--muted);font-size:12px}

/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-radius:999px;box-shadow:var(--shadow);
  display:flex;gap:6px;padding:7px;z-index:10;width:max-content;max-width:calc(100% - 32px)}
.nav button{border:0;background:transparent;border-radius:999px;height:46px;min-width:46px;padding:0 14px;display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:600;font-size:14px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{background:var(--rose-deep);color:var(--on-rose)}
.nav button:not([aria-current="page"]) span{position:absolute;left:-9999px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}

/* small-character overrides: the word leads, siblings sit small in the corner */
.tilebg{aspect-ratio:1.2/1;padding:12px;flex-direction:column;justify-content:flex-start;align-items:flex-start}
.tilebg .bubble{position:static;background:transparent;padding:0;border-radius:0;font-size:clamp(16px,4.4vw,20px);color:var(--ink);max-width:100%}
.tilebg .hint{font-size:12px;color:var(--muted);margin-top:4px}
.tilebg .duo-art{position:absolute;right:4px;bottom:0;width:46%;height:auto;aspect-ratio:1.25/1}
.stage{min-height:0;display:flex;align-items:flex-end;justify-content:flex-start;gap:10px;padding:12px 14px 0}
.stage .say{position:static;max-width:none;flex:1;margin-bottom:14px}
.stage .duo-art{order:-1;flex:0 0 112px;width:112px;height:96px;margin:0}
.stage .duo-art .main svg{width:64%}
.stage .duo-art .side svg{width:46%}

/* illustration portraits */
.face img,.pface{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.pair{position:absolute;right:10px;bottom:10px;display:flex;align-items:flex-end}
.pa{display:block;border-radius:50%;border:3px solid var(--surface);background:var(--surface);position:relative}
.pa.side{width:34px;height:34px;margin-right:-10px}
.pa.main{width:50px;height:50px;z-index:1}
.react{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:2px solid var(--surface)}
.react.ok{background:var(--sun);color:var(--sun-ink)}
.react.no{background:var(--rose-deep);color:var(--on-rose)}
.tilebg{aspect-ratio:1.35/1}
.stage{padding:14px;align-items:center}
.stage .pair{position:static;order:-1;flex:0 0 auto}
.stage .pa.side{width:48px;height:48px;margin-right:-14px}
.stage .pa.main{width:74px;height:74px}
.stage .say{margin-bottom:0}
.hero .art{height:auto;align-self:stretch;display:flex;align-items:flex-end;justify-content:center;margin:-22px -20px -18px 0}
.heroimg{display:block;width:100%;max-width:170px;height:auto;border-radius:22px 0 28px 0;object-fit:cover;mask-image:linear-gradient(to bottom,#000 80%,transparent);-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent)}
.fullimg{display:block;height:230px;width:auto;max-width:45%;object-fit:contain;border-radius:18px;margin-left:auto}

.poseimg{display:block;width:132px;height:132px;flex:0 0 132px;order:-1;border-radius:20px;object-fit:cover;background:#fff}
.poseimg.big{width:170px;height:170px;flex-basis:170px;order:0;margin-left:auto}
.stage{padding:12px}
@media (prefers-reduced-motion:no-preference){.hop .poseimg{animation:hop .5s ease}}

/* welcome */
.nav[hidden]{display:none}
.wel{width:100%;min-width:0;min-height:calc(100dvh - 32px);display:flex;flex-direction:column;gap:16px}
.wel .top{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.wel .skip{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:8px 4px}
.wel .dots{display:flex;gap:6px}
.wel .dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:all .3s}
.wel .dots i.on{width:24px;background:var(--rose-deep)}
.wstage{border-radius:32px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;aspect-ratio:1/.9;position:relative}
.wstage.rose{background:var(--rose-deep)}
.wstage.nik{background:var(--blush)}
.wstage.ash{background:var(--sage)}
.wstage.sun{background:var(--peach)}
.wstage{width:100%;min-width:0;align-items:center;padding:14px}.wstage img{display:block;height:100%;width:auto;max-width:100%;object-fit:contain;border-radius:24px}
.wstage .portrait{height:auto;width:62%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:6px solid var(--surface);background:var(--surface)}
.wbubble{background:var(--surface);border-radius:24px 24px 24px 6px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.wbubble b{font-family:var(--display);font-size:20px;line-height:1.2;color:var(--rose-deep)}
.wbubble p{font-size:15px}
.wbubble small{font-size:12px;color:var(--muted)}
.wsteps{display:grid;gap:10px}
.wsteps div{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;font-size:14px}
.wsteps .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:700}
.wel .grow{flex:1}
.wel .btnrow{display:flex;gap:10px}
.wel .btnrow .bigbtn.soft{width:auto;flex:0 0 auto}
@media (prefers-reduced-motion:no-preference){.wel .enter{animation:wIn .5s ease both}@keyframes wIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
</style>

<div class="app" id="app"></div>
<nav class="nav" aria-label="Main">
  <button type="button" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
  <button type="button" data-nav="saved"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-8.6C1.6 8.3 3.6 5 7 5c2 0 3.4 1.2 5 3 1.6-1.8 3-3 5-3 3.4 0 5.4 3.3 4 6.4C19 15.6 12 20 12 20z"/></svg><span>Saved</span></button>
  <button type="button" data-nav="progress"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg><span>Progress</span></button>
</nav>
<div class="toast" id="toast" hidden aria-live="polite"></div>

    <div class="left">
      <div><h1>Learn a word, earn a star</h1><p>Nik brings the smart words. Ash brings the slang.</p></div>
      <div class="cta"><button class="pill" type="button" id="playNext">${done===W.length?"Replay all":"Play next card"}</button><button class="round" type="button" id="playNext2" aria-label="Play next card">${ARROW}</button></div>
      <div class="rankrow"><div class="lbl"><b>${c[1]}</b><span>${n?`${n[0]-S.stars} stars to ${n[1]}`:"Top rank reached"}</span></div><div class="meter"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="art"><img class="heroimg" src="${IMG.duo}" alt="Nik and Ash"></div>
  </section>
  <div class="chips" role="group" aria-label="Show cards">
    ${[["all","All cards"],["nik","Nik's smart words"],["ash","Ash's slang"],["saved","Saved"]].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${S.filter===k}">${t}</button>`).join("")}
  </div>
  <div class="sec"><h2>${S.filter==="saved"?"Saved words":"Today's cards"}</h2><span>${done} of ${W.length} solved</span></div>
  <div class="grid">${list.length?list.map(cardTile).join(""):`<p class="empty">${S.filter==="saved"?"Nothing saved yet. Tap the heart on any card to keep it here.":"No cards here."}</p>`}</div>`;
}
function cardTile(i){
  const w=W[i],a=S.ans[i],H=HOST[w.h];
  const badge=a&&a.done?(a.ok?`<span class="badge">+${a.earned} ★</span>`:`<span class="badge miss">Try again</span>`):"";
  return `<button class="wcard" type="button" data-open="${i}" aria-label="${w.w}, hosted by ${H.name}">
    ${badge}
    <div class="tilebg ${w.h}"><span class="bubble">${w.w}</span><span class="hint">${w.p}</span>${duo(w.h,a&&a.done?(a.ok?"wow":"sad"):"happy")}</div>
    <div class="wmeta"><span class="who">${H.name}'s ${w.h==="nik"?"word":"slang"}</span><span class="rar" aria-label="${RLAB[w.r]}">${STAR.repeat(w.r)}</span></div>
  </button>`;
}
function vCard(){
  const i=S.cur,w=W[i],H=HOST[w.h],a=S.ans[i],done=a&&a.done,o=optsFor(i);
  const mood=done?(a.ok?"wow":"sad"):"happy";
  const line=done?(a.ok?H.yes[i%H.yes.length]:H.no):H.ask;
  return `
  <div class="dtop">
    <button class="round" type="button" id="back" aria-label="Back to cards">${BACK}</button>
    <span class="title">${H.name}'s ${w.h==="nik"?"word":"slang"}</span>
    <button class="round save" type="button" id="saveBtn" aria-pressed="${!!S.saved[i]}" aria-label="${S.saved[i]?"Remove from saved":"Save word"}">${HEART}</button>
  </div>
  <section class="stage ${w.h} ${anim===i?"hop":""}">
    <div class="say ${anim===i?"pop":""}"><b>${H.name}, your ${H.role}</b>${line}${done&&a.ok?` <span class="earned">${STAR.repeat(a.earned)}</span>`:""}</div>
    <img class="poseimg" src="${IMG[done?(a.ok?(a.bonus?"party":(i%2?"thumbs":"cheer")):"wrong"):"think"]}" alt="">
  </section>
  <div class="wordhead">
    <h1>${w.w}</h1>
    <div class="subrow"><span class="muted">${w.p}</span><button class="listen" type="button" id="listen">Listen</button>
      <span class="tagp sun">${STAR.replace('aria-hidden="true"','aria-hidden="true" style="width:12px;height:12px;vertical-align:-1px;fill:currentColor"')} ${RLAB[w.r]}</span></div>
  </div>
  <div class="opts">${o.map((t,k)=>{let c="";if(done){c=t===w.m?"right":t===a.pick?"wrong":"dim";}
    return `<button class="opt ${c}" type="button" data-k="${k}" ${done?"disabled":""}><span class="dot">${"ABC"[k]}</span>${t}</button>`;}).join("")}</div>
  ${done?`<div class="reveal"><span class="ex">"${w.ex}"</span>${w.o?`<span class="orig">${w.o}</span>`:""}</div>
    ${a.ok?"":`<button class="bigbtn soft" type="button" id="retry">Try again</button>`}
    <button class="bigbtn" type="button" id="next">Next card ${ARROW}</button>`:""}`;
}

/* ---------- welcome: the siblings introduce themselves ---------- */
const WEL=[
 {tone:"rose",img:"cheer",tag:"Welcome",title:"Hi! We're Nik and Ash",body:"A brother and sister who love words. Learn one new word at a time, earn stars, and sound sharper every day.",who:"Nik and Ash"},
 {tone:"nik",face:"nik",tag:"Meet Nik, your elder sister",title:"I bring the smart words",body:"Petrichor, serendipity, apricity. Rare, beautiful words that make you sound well read. I'll go slowly and explain everything.",who:"Nik",say:"Lovely, that's right!"},
 {tone:"ash",face:"ash",tag:"Meet Ash, your younger brother",title:"I bring the slang",body:"Rizz, delulu, no cap. The words your friends actually use. Fair warning: great for chats, not for office emails.",who:"Ash",say:"Yesss! You ate that."},
 {tone:"sun",img:"thumbs",tag:"How it works",title:"Three taps to a star",steps:["Flip a word card","Pick the right meaning from three options","Earn stars. Three right in a row gives 2 bonus stars"],who:"Nik and Ash"}
];
function vWelcome(){
  const st=Math.min(S.step||0,WEL.length-1),c=WEL[st],last=st===WEL.length-1;
  const art=c.face?`<img class="portrait" src="${IMG[c.face]}" alt="${c.who}">`:`<img src="${IMG[c.img]}" alt="${c.who}">`;
  return `<div class="wel">
    <div class="top"><div class="dots" aria-label="Step ${st+1} of ${WEL.length}">${WEL.map((_,k)=>`<i class="${k===st?"on":""}"></i>`).join("")}</div>
      ${last?"<span></span>":`<button class="skip" type="button" id="wSkip">Skip</button>`}</div>
    <div class="wstage ${c.tone} enter" key="${st}">${art}</div>
    <div class="wbubble enter"><small>${c.tag}</small><b>${c.title}</b>
      ${c.steps?`<div class="wsteps">${c.steps.map((t,k)=>`<div><span class="n">${k+1}</span>${t}</div>`).join("")}</div>`:`<p>${c.body}</p>`}
      ${c.say?`<small>"${c.say}"</small>`:""}</div>
    <div class="grow"></div>
    <div class="btnrow">${st?`<button class="bigbtn soft" type="button" id="wBack" aria-label="Previous">${BACK}</button>`:""}
      <button class="bigbtn" type="button" id="wNext">${last?"Let's play":"Next"} ${ARROW}</button></div>
  </div>`;
}
function vProgress(){
  const [c,n]=rankOf(S.stars);
  const first=Object.values(S.ans).filter(a=>a.first!==undefined),acc=first.length?Math.round(first.filter(a=>a.first).length/first.length*100)+"%":"–";
  return `
  <div class="sec"><h2>Your progress</h2></div>
  <section class="stage nik" style="min-height:190px;justify-content:space-between;padding:14px">
    <div class="say"><b>Nik and Ash</b>${S.stars?`You're a ${c[1].toLowerCase()} now. ${n?`${n[0]-S.stars} more stars to ${n[1]}!`:"You've reached the top rank!"}`:"Answer your first card to start earning stars."}</div>
    <span></span><img class="poseimg big" src="${S.stars?IMG.party:IMG.read}" alt="Nik and Ash">
  </section>
  <div class="tiles"><div class="tile"><b>${S.stars}</b><span>Stars</span></div><div class="tile"><b>${acc}</b><span>First-try accuracy</span></div><div class="tile"><b>${S.best}</b><span>Best run</span></div></div>
  <div class="sec"><h2>Ranks</h2><span>3 right in a row = 2 bonus stars</span></div>
  <div class="ranks">${RANKS.map(r=>`<div class="rk ${S.stars>=r[0]?"got":""} ${r===c?"now":""}"><span class="ic">${S.stars>=r[0]?"★":r[0]}</span><div>${r[1]}<small>${r[0]?r[0]+" stars":"Where everyone starts"}</small></div></div>`).join("")}</div>
  <button class="bigbtn soft" type="button" id="replayIntro">Meet Nik and Ash again</button>
  <button class="bigbtn soft" type="button" id="reset">Start over</button>`;
}

/* ---------- render & actions ---------- */
function render(){
  const a=document.getElementById("app");
  document.querySelector(".nav").hidden=S.view==="welcome";
  a.innerHTML=S.view==="welcome"?vWelcome():S.view==="card"?vCard():S.view==="progress"?vProgress():vHome();
  const navKey=S.view==="progress"?"progress":(S.view==="home"&&S.filter==="saved")?"saved":"home";
  document.querySelectorAll("[data-nav]").forEach(b=>b.dataset.nav===navKey?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  anim=null;
}
function go(view,scroll=true){S.view=view;save();render();if(scroll)window.scrollTo({top:0});}
function nextIndex(){const order=W.map((_,i)=>i);const start=S.cur+1;
  for(let k=0;k<W.length;k++){const i=order[(start+k)%W.length];if(!(S.ans[i]&&S.ans[i].done&&S.ans[i].ok))return i;}return -1;}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400);}
function playNext(){
  if(W.every((_,i)=>S.ans[i]&&S.ans[i].done&&S.ans[i].ok)){S.ans={};S.opts={};toast("New round. Your stars stay.");}
  const i=S.view==="card"?nextIndex():(()=>{for(let k=0;k<W.length;k++)if(!(S.ans[k]&&S.ans[k].done&&S.ans[k].ok))return k;return 0;})();
  if(i<0){go("progress");toast("All cards solved!");return;}
  S.cur=i;go("card");
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="wNext"){if(S.step>=WEL.length-1){S.welcomed=true;S.step=0;go("home");}else{S.step++;save();render();window.scrollTo({top:0});}return;}
  if(t.id==="wBack"){S.step=Math.max(0,S.step-1);save();render();return;}
  if(t.id==="wSkip"){S.welcomed=true;S.step=0;go("home");return;}
  if(t.id==="replayIntro"){S.step=0;go("welcome");return;}
  if(t.dataset.nav){const n=t.dataset.nav;if(n==="saved"){S.filter="saved";go("home");}else if(n==="home"){if(S.filter==="saved")S.filter="all";go("home");}else go("progress");return;}
  if(t.dataset.f){S.filter=t.dataset.f;save();render();return;}
  if(t.dataset.open){S.cur=+t.dataset.open;go("card");return;}
  if(t.id==="playNext"||t.id==="playNext2"||t.id==="next"){playNext();return;}
  if(t.id==="back"){go("home");return;}
  if(t.id==="saveBtn"){S.saved[S.cur]=!S.saved[S.cur];if(!S.saved[S.cur])delete S.saved[S.cur];save();render();toast(S.saved[S.cur]?"Saved":"Removed from saved");return;}
  if(t.id==="listen"){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(W[S.cur].w);u.lang="en-IN";u.rate=.8;speechSynthesis.speak(u);}catch(err){toast("Audio isn't available here");}return;}
  if(t.id==="retry"){S.ans[S.cur].done=false;S.opts[S.cur]=shuffle([W[S.cur].m,...W[S.cur].x]);save();render();return;}
  if(t.id==="reset"){S=fresh();S.welcomed=true;S.view="home";save();render();toast("Started over");return;}
  if(t.dataset.k!==undefined&&S.view==="card"){
    const i=S.cur,w=W[i],pick=optsFor(i)[+t.dataset.k],prev=S.ans[i]||{},retry=(prev.tries||0)>0,ok=pick===w.m;
    const before=S.stars;
    const a={done:true,ok,pick,tries:(prev.tries||0)+1,first:prev.first!==undefined?prev.first:ok,earned:0};
    let bonus=false;
    if(ok){a.earned=retry?1:w.r;S.stars+=a.earned;if(!retry){S.run++;S.best=Math.max(S.best,S.run);if(S.run%3===0){S.stars+=2;bonus=true;}}}
    else S.run=0;
    a.bonus=bonus;S.ans[i]=a;anim=i;save();render();
    const rb=rankOf(before)[0][1],ra=rankOf(S.stars)[0][1];
    if(bonus)toast(`${S.run} in a row! +2 bonus stars`);
    if(ra!==rb)setTimeout(()=>toast(`New rank: ${ra}`),bonus?2500:200);
  }
});
render();
</script>
